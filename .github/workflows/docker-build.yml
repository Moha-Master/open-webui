name: Build and Push to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ACR_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/open-webui:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear stale Docker Hub credentials
        run: docker logout

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login "${{ vars.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_HASH=${{ github.sha }} \
            -t "${{ env.ACR_IMAGE }}" \
            .

      - name: Push image
        run: |
          docker push "${{ env.ACR_IMAGE }}"
